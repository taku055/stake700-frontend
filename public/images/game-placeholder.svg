<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3342"/>
      <stop offset="1" stop-color="#0c1a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F3B52D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F3B52D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2" height="16" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#C98A12"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#bg)"/>
  <rect width="400" height="320" fill="url(#stripes)"/>
  <circle cx="200" cy="160" r="120" fill="url(#glow)"/>
  <!-- three reels -->
  <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" opacity="0.85">
    <rect x="118" y="118" width="164" height="84" rx="16"/>
    <line x1="173" y1="128" x2="173" y2="192"/>
    <line x1="227" y1="128" x2="227" y2="192"/>
  </g>
  <!-- a "7" in each reel -->
  <g fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M134 143h22l-12 34"/>
    <path d="M189 143h22l-12 34"/>
    <path d="M243 143h22l-12 34"/>
  </g>
</svg>
